server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the agent. Expects the agent reachable as "agent:8090"
  # on the same Docker network (compose service name). SSE-friendly settings.
  location /api/ {
    proxy_pass http://agent:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
