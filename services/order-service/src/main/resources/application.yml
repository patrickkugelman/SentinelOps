server:
  port: 8080
  tomcat:
    threads:
      # Deliberately modest so a slow dependency can exhaust the worker pool
      # and produce a visible cascading failure. Tunable per demo.
      max: ${TOMCAT_MAX_THREADS:25}
    accept-count: ${TOMCAT_ACCEPT_COUNT:20}

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:sentinelops}
    password: ${SPRING_DATASOURCE_PASSWORD:sentinelops}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  inventory-url: ${INVENTORY_URL:http://localhost:8081}
  payment-url: ${PAYMENT_URL:http://localhost:8082}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
