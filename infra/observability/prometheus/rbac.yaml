# Cluster-wide read access so Prometheus can discover and scrape pods across
# namespaces via kubernetes_sd_configs (role: pod / endpoints / node).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: sentinelops-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinelops-prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinelops-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinelops-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: sentinelops-observability
