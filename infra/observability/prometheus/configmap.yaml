apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sentinelops-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
      external_labels:
        cluster: sentinelops

    scrape_configs:
      # Prometheus scraping itself.
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Annotation-based pod discovery. Any pod carrying
      #   prometheus.io/scrape: "true"
      #   prometheus.io/path:   "/actuator/prometheus"
      #   prometheus.io/port:   "8080"
      # is scraped at that path/port. The demo services set these in the Helm chart.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # Expose the workload name as `app` (e.g. order-service) — the label
          # the agent queries on.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_sentinelops_io_component]
            action: replace
            target_label: component
