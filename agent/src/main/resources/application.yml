server:
  port: ${AGENT_PORT:8090}

spring:
  application:
    name: sentinelops-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinelops}
    username: ${POSTGRES_USER:sentinelops}
    password: ${POSTGRES_PASSWORD:sentinelops}
  flyway:
    enabled: true
    # The shared DB may already contain the Phase 1 bootstrap objects, so baseline
    # the existing schema instead of failing on a non-empty public schema.
    # baseline-version 0 ensures our V1 migration still runs (a default baseline
    # of 1 would mark V1 as already applied and skip creating the table).
    baseline-on-migrate: true
    baseline-version: 0
    placeholders:
      embeddingDimension: ${EMBEDDING_DIMENSION:1536}

sentinelops:
  embedding:
    provider: ${EMBEDDING_PROVIDER:local}          # local | openai
    dimension: ${EMBEDDING_DIMENSION:1536}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  retrieval:
    top-k: ${AGENT_RETRIEVAL_TOP_K:5}
    recall-pool-size: 30
    weights:
      vector: 0.50
      symptom: 0.25
      error-category: 0.15
      service: 0.10
  incidents:
    auto-ingest: ${INCIDENTS_AUTO_INGEST:true}
  agent:
    namespace: ${DEMO_NAMESPACE:sentinelops-demo}
    # Guardrail: remediation is refused outside this namespace.
    allowed-namespace: ${AGENT_ALLOWED_NAMESPACE:sentinelops-demo}
    dry-run: ${AGENT_DRY_RUN:false}
    auto-remediate: ${AGENT_AUTO_REMEDIATE:false}   # scheduled auto-response (default off)
    poll-seconds: 20
    error-rate-threshold: 0.10                        # 5xx ratio
    latency-p95-seconds: 1.0
    verify-seconds: ${AGENT_VERIFY_SECONDS:0}         # >0 = wait & check recovery
    max-replicas: 4
    planner: ${AGENT_PLANNER:rule}                    # rule | llm
    llm:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

prometheus:
  url: ${PROMETHEUS_URL:http://localhost:30090}
  connect-timeout: 2s
  read-timeout: 5s

chaos:
  namespace: ${DEMO_NAMESPACE:sentinelops-demo}
  # Guardrail: the agent refuses to create/delete chaos outside this namespace.
  allowed-namespace: ${AGENT_ALLOWED_NAMESPACE:sentinelops-demo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
