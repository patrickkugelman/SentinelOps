apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgres.serviceName }}-init
  labels:
    {{- include "demo.labels" . | nindent 4 }}
data:
  init.sql: |
    -- Runs on first init (empty data dir). Each service gets its own database.
    {{- range .Values.postgres.databases }}
    CREATE DATABASE {{ . }};
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
        {{- include "demo.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: password
            - name: POSTGRES_DB
              value: sentinelops
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap:
            name: {{ .Values.postgres.serviceName }}-init
        # emptyDir: demo data is disposable and re-seeded on every restart,
        # which also re-runs the CREATE DATABASE init above.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
    {{- include "demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.postgres.serviceName }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
